# The server's web UI only answers requests whose Host header is localhost,
# and Wine's http.sys rejects the lowercase header names haproxy sends by
# default.
global
    h1-case-adjust host Host
    h1-case-adjust user-agent User-Agent
    h1-case-adjust accept Accept
    h1-case-adjust content-type Content-Type
    h1-case-adjust content-length Content-Length

defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend ui
    bind :8080
    default_backend rrre

backend rrre
    option h1-case-adjust-bogus-server
    http-request set-header Host localhost:8088
    server rrre 127.0.0.1:8088
