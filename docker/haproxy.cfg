# The server's web UI only binds 127.0.0.1:8088 and rejects any request whose
# Host header is not localhost, so it cannot be published directly.
defaults
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend ui
    bind :8080
    default_backend rrre

backend rrre
    http-request set-header Host localhost:8088
    server rrre 127.0.0.1:8088
